aid: spline-design
name: Spline
description: >-
  Spline is a web-based, real-time collaborative 3D design platform used to
  create interactive 3D scenes, animations, and product experiences for the
  web, iOS, and Android. The Spline editor runs in the browser and supports
  multi-user collaboration with comments, link sharing, and team workspaces.
  Designers build scenes using primitives and modeling tools, a layer-based
  material system, states, events, timeline animation, game controls, physics,
  and particles. Scenes can be exported as GLTF/GLB, USDZ, STL, video, image
  sequences, or as code for the web, SwiftUI, and Kotlin. Spline's developer
  surface centers on runtime libraries — `@splinetool/runtime`, the
  `@splinetool/react-spline` React component, the `r3f-spline` hook for
  react-three-fiber, and `spline-ios` for Apple platforms — plus an embeddable
  Spline Viewer web component. Inside scenes, Spline exposes a Real-time API
  for dynamic data binding and webhooks for event-driven integrations. The
  company also ships Hana, a web-based collaborative UI design tool with
  infinite canvas, vector networks, visual effects, and motion design.
  Spline's revenue model is SaaS subscription with Free, Starter ($12/mo
  annual), Professional ($20/mo annual), and Enterprise tiers, plus a Spline
  AI add-on ($5/seat/month, 2000 AI credits) for prompt-driven 3D generation.
  There is no publicly documented Spline REST/management API or OpenAPI
  specification at this time; programmatic surfaces are limited to the
  runtime SDKs, the Real-time API, and webhooks exposed from within a scene.
